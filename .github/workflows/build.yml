name: Build CamSwap APK

# ─────────────────────────────────────────────
#  Triggers
# ─────────────────────────────────────────────
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'            # also fires on version tags like v2.7
  pull_request:
    branches: [ main ]
  workflow_dispatch:    # allows manual trigger from GitHub Actions UI

# ─────────────────────────────────────────────
#  Permissions
# ─────────────────────────────────────────────
permissions:
  contents: write       # needed to upload release assets

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest   # free GitHub-hosted runner

    steps:
      # ── 1. Checkout (with Dobby submodule) ──────────────────────────────
      - name: Checkout repository + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive   # initialises app/src/main/cpp/third_party/Dobby
          fetch-depth: 0          # full history (useful for versioning)

      # ── 2. Java 17 (required by AGP 8.9.0) ─────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle           # caches ~/.gradle between runs

      # ── 3. NDK + CMake (required by Dobby C++ submodule) ────────────────
      - name: Install NDK and CMake
        uses: android-actions/setup-android@v3
        # The action installs the Android SDK; we pin specific NDK + CMake below
      
      - name: Install specific NDK version
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      # ── 4. Gradle wrapper permissions ───────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Gradle cache (speeds up subsequent builds significantly) ──────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 6. Build debug APK (always) ─────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ── 7. Build release APK (unsigned) ─────────────────────────────────
      #    Produces app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ── 8. Sign release APK ─────────────────────────────────────────────
      #    Requires these repo secrets:
      #      KEYSTORE_BASE64   – base64-encoded .jks keystore file
      #      KEY_ALIAS         – key alias inside the keystore
      #      KEY_PASSWORD      – key password
      #      STORE_PASSWORD    – keystore password
      #
      #    To create secrets:
      #      base64 -w 0 your_keystore.jks | pbcopy   (macOS)
      #      Then paste into Settings → Secrets → Actions → New secret
      - name: Sign release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

          # Find the unsigned APK (handles single or split ABIs)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*unsigned*.apk" | head -1)
          SIGNED_APK="${UNSIGNED_APK/unsigned/signed}"

          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV

          # Clean up keystore from runner disk
          rm -f release.jks

      # ── 9. Upload debug APK as workflow artifact ─────────────────────────
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # ── 10. Upload release APK as workflow artifact ──────────────────────
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 11. Create GitHub Release (only on version tags) ─────────────────
      #    Pushes APKs to the Releases page automatically when you tag:
      #      git tag v2.7 && git push origin v2.7
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
